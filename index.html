<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Orik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Press+Start+2P&display=swap">
<style>
/* Layout: one full-bleed landscape canvas; HUD strip on top, menus as offset-shadow cards, thumb pads in the bottom corners.
   Single dark arcade look on purpose: flag red + black, lekë gold, felt-cap white. */
:root{
  --ink:#140f12;
  --panel:#1f171b;
  --paper:#f6f0e4;
  --muted:#c2b6ba;
  --flag:#d7263d;
  --flag-deep:#8e1b2a;
  --gold:#f5c542;
  --gold-deep:#8a6a12;
  --font-logo:"Press Start 2P", ui-monospace, Menlo, monospace;
  --font-display:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#game{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:crisp-edges;image-rendering:pixelated;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 6px calc(12px + env(safe-area-inset-left,0px));
  pointer-events:none;font-family:var(--font-display);font-size:14px;font-weight:800;line-height:1;text-shadow:2px 2px 0 #000}
.chip{display:flex;align-items:center;gap:6px;background:rgba(20,15,18,.6);padding:6px 8px;border-radius:2px;white-space:nowrap}
.chip.done{background:rgba(58,166,85,.75)}
.chip.alarm{background:var(--flag);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:var(--flag-deep)}}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 var(--gold-deep);color:#5c4300;font-size:7px;line-height:12px;text-align:center;text-shadow:none}
.plis{width:12px;height:8px;border-radius:6px 6px 1px 1px;background:var(--paper);box-shadow:inset 0 -2px 0 #bdb5a6}
#hud .spacer{flex:1}
.hbtn{pointer-events:auto;font:inherit;color:var(--paper);text-shadow:inherit;background:rgba(20,15,18,.6);border:2px solid rgba(246,240,228,.4);border-radius:3px;min-width:40px;height:34px;padding:0 8px;cursor:pointer}
.hbtn.off{opacity:.55;text-decoration:line-through}
.hbtn:focus-visible,.btn:focus-visible,.lvb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:620px){#hLevel{display:none}}

/* Touch pads */
#pad{position:absolute;inset:0;z-index:3;display:none}
#pad.show{display:block}
.tb{position:absolute;width:76px;height:76px;border-radius:50%;border:3px solid rgba(246,240,228,.45);background:rgba(20,15,18,.3);
  color:rgba(246,240,228,.9);display:grid;place-items:center;align-content:center;gap:2px;font-family:var(--font-display);font-size:20px;font-weight:900;pointer-events:none}
.tb small{font-family:var(--font-body);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tb svg{width:26px;height:26px;fill:currentColor}
.tb.on{background:rgba(215,38,61,.6);border-color:var(--paper)}
#tL{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(104px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tB{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#tA{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:84px;height:84px}

/* Toast */
#toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--panel);border:2px solid var(--paper);box-shadow:3px 3px 0 #000;
  padding:8px 12px;font-family:var(--font-display);font-size:15px;font-weight:800;line-height:1.35;text-align:center;max-width:min(90vw,460px);pointer-events:none}

/* Screens */
#screen{position:absolute;inset:0;z-index:8;display:grid;place-items:center;overflow:auto;background:rgba(12,8,10,.5);
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  padding-inline:calc(16px + env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:3px solid var(--paper);box-shadow:6px 6px 0 #000;padding:18px 20px;width:100%;max-width:600px;display:grid;gap:12px;text-align:center}
.title{max-width:720px;grid-template-columns:1fr;align-items:center}
@media (min-width:640px){.title{grid-template-columns:1fr 1.15fr;text-align:left}.title .brand{justify-items:start}}
.brand{display:grid;justify-items:center;gap:8px}
.flagbox{background:var(--flag);border:3px solid #000;padding:6px 10px;box-shadow:3px 3px 0 #000;line-height:0}
.flagbox canvas{width:66px;height:60px;image-rendering:pixelated}
.flagbox.helm{background:#2b2126}
.logo{margin:0;font-family:var(--font-logo);font-weight:400;font-size:clamp(40px,9vw,66px);letter-spacing:.04em;color:var(--flag);text-shadow:4px 4px 0 #000;line-height:1}
.tag{margin:0;font-size:18px;font-weight:700;color:var(--paper)}
.tag span{color:var(--muted)}
.side{display:grid;gap:10px;min-width:0}
.lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lvb{font-family:var(--font-body);font-size:17px;font-weight:700;text-align:left;color:var(--paper);background:#2b2126;border:2px solid #5a4a50;border-radius:2px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.lvb b{font-family:var(--font-display);font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.04em}
.lvb[disabled]{opacity:.45;cursor:not-allowed}
.lvb:not([disabled]):hover{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.title .row{justify-content:flex-start}
.btn{font-family:var(--font-display);font-size:16px;font-weight:900;line-height:1.3;color:var(--ink);background:var(--gold);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px 14px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{background:var(--flag);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.help{margin:0;font-size:15px;font-weight:600;line-height:1.5;color:var(--muted)}
.help b{color:var(--paper);font-weight:600}
.eyebrow{margin:0;font-family:var(--font-display);font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--gold)}
.card h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(22px,4.5vw,30px);line-height:1.2;color:var(--paper);text-wrap:balance}
.en{margin:-4px 0 0;font-size:18px;font-weight:600;color:var(--muted)}
.mission{border:2px dashed var(--gold);padding:10px 12px;font-size:18px;font-weight:600;line-height:1.4}
.mission b{display:block;font-family:var(--font-display);font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--gold);margin-bottom:6px}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--font-display);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:6px}
.hint{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.lvb.final{grid-column:1 / -1}
.story{max-width:560px}
.art{justify-self:center;image-rendering:pixelated;height:auto}
.tale{margin:0;font-size:19px;font-weight:600;line-height:1.55;text-align:left;text-wrap:pretty}
@media (max-width:560px){#hScoreC{display:none}}

/* Rotate prompt */
#rotate{position:absolute;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;text-align:center;padding:24px}
#rotate .card{max-width:340px}
.phone{width:44px;height:74px;border:4px solid var(--paper);border-radius:8px;margin:0 auto;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone,.chip.alarm{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="game" width="320" height="192" aria-label="Orik"></canvas>
  <div id="pad" aria-hidden="true">
    <div class="tb" id="tL"><svg viewBox="0 0 20 20"><path d="M14 3 5 10l9 7z"/></svg></div>
    <div class="tb" id="tR"><svg viewBox="0 0 20 20"><path d="M6 3l9 7-9 7z"/></svg></div>
    <div class="tb" id="tB"><span>B</span><small id="sPadB">vrap · ulli</small></div>
    <div class="tb" id="tA"><span>A</span><small id="sPadA">kërce</small></div>
  </div>
  <div id="hud" hidden>
    <div class="chip"><span class="coin">L</span><b id="hLeke">0</b></div>
    <div class="chip"><span class="plis"></span><b id="hLives">×3</b></div>
    <div class="chip" id="hScoreC"><b id="hScore">0</b></div>
    <div class="chip" id="hMission"></div>
    <div class="spacer"></div>
    <div class="chip" id="hLevel"></div>
    <button class="hbtn" id="bMute" type="button" aria-label="Zëri">♪</button>
    <button class="hbtn" id="bPause" type="button" aria-label="Pushim">II</button>
  </div>
  <div id="toast" hidden></div>
  <div id="screen" hidden></div>
  <div id="rotate" hidden>
    <div class="card">
      <div class="phone"></div>
      <h2 id="sRotT">Rrotullo telefonin</h2>
      <p class="hint" id="sRotH">Oriku do shumë hapësirë të vrapojë. Ktheje telefonin horizontalisht.</p>
      <div class="row"><button class="btn ghost" id="bFsR" type="button">Ekran i plotë</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const TILE = 16, ROWS = 12, VH = ROWS * TILE;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
let VW = 320;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------------- save ---------------- */
const SAVE_KEY = 'orik-save-v1';
let save = { unlocked: 1, muted: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- sprites ---------------- */
const PAL = { K:'#1a1418', W:'#f4f1e8', R:'#d7263d', r:'#8e1b2a', S:'#f0b58a', s:'#c9855a', O:'#6b3e26',
  Y:'#f5c542', y:'#b8860b', G:'#3aa655', g:'#1f6b35', P:'#5b3a8c', p:'#3a2560', L:'#55661f', l:'#8a9a3a',
  T:'#e3a857', t:'#a0612b', D:'#2e7d4f', d:'#163d27', B:'#8fcf6a', F:'#ff8c1a', f:'#ffd23f', H:'#8b5a3c', h:'#5e3a24', E:'#d9d4c8', A:'#f4d35e', a:'#c99a2e', u:'#fbe3a4', n:'#4a8a2c', N:'#2f5e1c', c:'#f3ead2', X:'#b4202f', Q:'#e4e7eb', V:'#8f959e', q:'#6fa8cf', j:'#3d6f93' };
function mk(rows, pal) {
  pal = pal || PAL;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let y = 0; y < h; y++) { const r = rows[y]; for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } }
  return c;
}
function flipC(c) { const f = document.createElement('canvas'); f.width = c.width; f.height = c.height; const x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }
const both = c => [c, flipC(c)];
const dbl = rows => { const o = []; rows.forEach(r => { o.push(r, r); }); return o; };

// Orik: white plis (felt cap), black moustache, red vest over white shirt
const OH = ['.....WWWWW......','....WWWWWWW.....','...AAASSSSS.....','...AASSSKSS.....','...AASSSSSSs....','....ASSSSSS.....','......SSSS......'];
const OT = ['....RRWWWRR.....','...RRRWWWRRR....','..SRRRWWWRRRS...','..SSRRWWWRRSS...'];
const OTJ = ['..S.RRWWWRR.S...','..SRRRWWWRRRS...','...RRRWWWRRR....','....RRWWWRR.....'];
const LS = ['....KKKKKKK.....','....KKK.KKK.....','....KKK.KKK.....','...OOO...OOO....','..OOOO...OOOO...'];
const LW1 = ['....KKKKKKK.....','...KKK...KKK....','..KKK.....KK....','.OOO......OOO...','.OO........OO...'];
const LW2 = ['....KKKKKKK.....','.....KKKKK......','.....KK.KK......','....OOO.OOO.....','....OO..OO......'];
function orikSet(pal, head, legFn, ot, otj) {
  head = head || OH; ot = ot || OT; otj = otj || OTJ;
  const lg = a => legFn ? a.map(legFn) : a;
  const ls = lg(LS), l1 = lg(LW1), l2 = lg(LW2);
  return {
    small: { stand: both(mk([...head, ...ot, ...ls], pal)), w1: both(mk([...head, ...ot, ...l1], pal)), w2: both(mk([...head, ...ot, ...l2], pal)), jump: both(mk([...head, ...otj, ...l1], pal)) },
    big: { stand: both(mk([...head, ...dbl(ot), ...dbl(ls)], pal)), w1: both(mk([...head, ...dbl(ot), ...dbl(l1)], pal)), w2: both(mk([...head, ...dbl(ot), ...dbl(l2)], pal)), jump: both(mk([...head, ...dbl(otj), ...dbl(l1)], pal)) }
  };
}
const OLIVE_PAL = { R: '#6f8f2a', r: '#3f5a17' };
const ORIK = orikSet(PAL);
const ORIK_OLIVE = orikSet(Object.assign({}, PAL, OLIVE_PAL));
// Finland: fur hat with ear flaps, huge puffy Finland-blue winter coat with a fur collar, white zip, coat hem over the knees
const OH_FI = ['....EEEEEEE.....','...EEEEEEEEE....','...EAASSSSS.....','...EASSSKSS.....','...EASSSSSSs....','....ASSSSSS.....','......SSSS......'];
const OT_FI = ['...EEEEEEEEE....','..jjjjjWjjjjj...','.SjjjjjWjjjjjS..','.SjjjjjWjjjjjS..'];
const OTJ_FI = ['.S.EEEEEEEEE.S..','.SjjjjjWjjjjjS..','..jjjjjWjjjjj...','..jjjjjWjjjjj...'];
const fiLeg = (r, i) => i === 0 ? '...jjjjjjjjj....' : r;
const FI_PAL = Object.assign({}, PAL, { j: '#2457b5', E: '#ece8df' });
// Thailand: blond hair, cream raj-pattern jacket with a gold button placket, purple silk chong kraben, black shoes
const OH_TH = ['.....AAAAA......','....AAAAAAA.....','...AAASSSSS.....','...AASSSKSS.....','...AASSSSSSs....','....ASSSSSS.....','......SSSS......'];
const TH_PAL = Object.assign({}, PAL, { R: '#f3ead2', W: '#e2b048' });
const thLeg = r => r.replace(/K/g, 'P').replace(/O/g, 'K');
const OUTFIT = {
  al: { base: ORIK, olive: ORIK_OLIVE },
  fi: { base: orikSet(FI_PAL, OH_FI, fiLeg, OT_FI, OTJ_FI), olive: orikSet(Object.assign({}, FI_PAL, { j: '#6f8f2a' }), OH_FI, fiLeg, OT_FI, OTJ_FI) },
  th: { base: orikSet(TH_PAL, OH_TH, thLeg), olive: orikSet(Object.assign({}, TH_PAL, OLIVE_PAL), OH_TH, thLeg) }
};

const COIN = mk(['....YYYYY....','..YYYYYYYYY..','.YYyyyyyyyYY.','.YyYYYYYYYyY.','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyYYYYYYyY','YyYYyyyyYYYyY','.YyYYYYYYYyY.','.YYyyyyyyyYY.','..YYYYYYYYY..','....YYYYY....']);
const BEETLE_TOP = ['.....KKKKKK.....','...KKPPPPPPKK...','..KPPpPPPPpPPK..','..KPPPpPPpPPPK..','.KPPPPPppPPPPPK.','.KPPPPPppPPPPPK.','.KKKKKKKKKKKKKK.','..KWK......KWK..','..KKK......KKK..'];
const BEETLE = [mk([...BEETLE_TOP, '..K..K....K..K..', '.K....K..K....K.']), mk([...BEETLE_TOP, '...K.K....K.K...', '...K..K..K..K...'])];
const BEETLE_FLAT = mk(['..KKKKKKKKKKKK..','.KPPPpPPPPpPPPK.','.KKKKKKKKKKKKKK.']);
const HOG_TOP = ['...K.K.K.K......','..KHKHKHKHK.....','.KHHhHHhHHHK....','KHHHHHHHHHHHK...','KHhHHHhHHHHSSK..','KHHHHHHHHHSSKSK.','KHHHHHHHHHSSSSKK','.KKKKKKKKKKKKKK.'];
const HOG = [both(mk([...HOG_TOP, '..K.K.....K.K...', '..K.K.....K.K...'])), both(mk([...HOG_TOP, '...K.K...K.K....', '...K.K...K.K....']))];
const CROW = [
  both(mk(['..KK............','..KKK...........','...KKK......KK..','....KKKKKKKKKWK.','....KKKKKKKKKKYY','.....KKKKKKKK...','......KK........'])),
  both(mk(['................','................','............KK..','....KKKKKKKKKWK.','....KKKKKKKKKKYY','...KKKKKKKKKK...','..KKK...........','.KK.............']))
];
const LAMB = both(mk(['......WWWWW.....','...WWWWWWWWWW...','..WWWWWWWWWWKKK.','..WWWWWWWWWWKWK.','..WWWWWWWWWWKKK.','...WWWWWWWWWW...','...K.K...K.K....','...K.K...K.K....']));
const KEY = mk(['.YYYY.........','YY..YY........','Y....YYYYYYYYY','YY..YY....Y.Y.','.YYYY.........']);
const BYREK = mk(['tt............','tuTt..........','tuuTTt........','tTuuuTTt......','tTTTuuuTTtt...','tTTTTTuuuTTTt.','tnnNnnnnNnnnnt','tuuuuuuuuuuuut','tnNnnnnNnnnNnt','tTTTTTTTTTTTTt','.tttttttttttt.']);
const PLIS = mk(['....WWWWWW....','..WWWWWWWWWW..','.WWWWWWWWWWWW.','.WWWWWWWWWWWW.','WWWWWWWWWWWWWW','WEEEEEEEEEEEEW','.EEEEEEEEEEEE.']);
const CHEST = mk(['..hhhhhhhhhh..','.hHHHHHHHHHHh.','hHHHHHHHHHHHHh','hYYYYYYYYYYYYh','hHHHHHYYHHHHHh','hHHHHHYyHHHHHh','hHHHHHHHHHHHHh','hYYYYYYYYYYYYh','hHHHHHHHHHHHHh','hHHHHHHHHHHHHh','hhhhhhhhhhhhhh']);
const CHEST_OPEN = mk(['hYYYYYYYYYYYYh','hhhhhhhhhhhhhh','..............','hYYYYYYYYYYYYh','hHHHHHHHHHHHHh','hHHHHHHHHHHHHh','hHHHHHHHHHHHHh','hYYYYYYYYYYYYh','hHHHHHHHHHHHHh','hHHHHHHHHHHHHh','hhhhhhhhhhhhhh']);
const PIECE = mk(['KKKKKKKKKKKK','KRRRRRRRRRRK','KRRRKRRKRRRK','KRRRKKKKRRRK','KRKKKKKKKKRK','KRRKKKKKKRRK','KRRRRKKRRRRK','KRRRKRRKRRXK','KRRRRRRRRXXK','KKKKKKKKKKKK']);
const OLIVE = mk(['........gG....','.......gGG....','......gG......','....KKKKKK....','...KLLLLLLK...','..KLLLLLWLLK..','..KLLLLLLWLK..','..KLLLLLLLLLK.','..KLLLLLLLLLK.','...KLLLLLLLLK.','....KLLLLLLK..','.....KKKKKK...']);
// Local snacks that replace byrek as the grow power-up: Thai salapao (steamed bun) and Finnish lihapiirakka (fried meat pie)
const SALAPAO = mk(['.....WWWW.....','...WWWRRWWW...','..WWWWRRWWWW..','.WWWWWWWWWWWW.','WWWWWWWWWWWWWW','WWWWWWWWWWWWWW','WEWWWWWWWWWWEW','.EEWWWWWWWWEE.','..EEEEEEEEEE..','.uuuuuuuuuuuu.']);
const PIIRAKKA = mk(['....tttttt....','..ttTTTTTTtt..','.tTTTuTTTTTTt.','tTTuTTTTTuTTTt','tTTTTTTTTTTTTt','tTTTTTuTTTTTTt','.tTTTTTTTTTTt.','..ttTTTTTTtt..','....tttttt....']);
const ITEM_SPR = { byrek: BYREK, olive: OLIVE, plis: PLIS, salapao: SALAPAO, piirakka: PIIRAKKA };
const ITEM_POP = { salapao: 'SALAPAO!', piirakka: 'LIHAPIIRAKKA!' };
const FEATHER = mk(['.......KK.','......KhWK','.....KhhWK','....KhHWhK','....KhWHhK','...KhHWhK.','...KhWHhK.','..KhHWhK..','..KhWhhK..','.KhHWhK...','.KhWhK....','KhWhK.....','.KWK......','..W.......']);
const HELMET = mk([
  '........yy........',
  '......yYYYYy......',
  '..yy..yKYYKy..yy..',
  '.y..y.yYYYYy.y..y.',
  'y....yyYyyYyy....y',
  'y.....QyYYyQ.....y',
  '.y..QQQQyyQQQQ..y.',
  '..yQQQQQQQQQQQQy..',
  '..QQQQQQQQQQQQQQ..',
  '.QQQQQQQQQQQQQQQQ.',
  '.QQQVQQQQQQQQVQQQ.',
  'QQQQVQQQQQQQQVQQQQ',
  'QVVVVVVVVVVVVVVVVQ',
  'QVyVVVyVVVVyVVVyVQ',

/* ---------------- level builder ---------------- */
function mkB(w, theme) {
  const L = { w, theme, t: new Uint8Array(w * ROWS), spawns: [], coins: [], deco: [], start: { x: 32 }, cps: [], goal: null, lambs: [], keys: [], multi: {}, gateX: null, arena: null, cage: null, aval: null, chests: [], pieces: [], secretsTotal: 0, secretsFound: 0, feathers: [], plats: [], cannons: [], rockZones: [], noCoins: false, helmet: null, elephants: [] };
  const set = (x, y, v) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) L.t[y * w + x] = v; };
  const b = {
    L,
    ground(x0, x1, top = 10) { for (let x = x0; x <= x1; x++) for (let y = top; y < ROWS; y++) set(x, y, T.GROUND); return b; },
    row(x, y, s) { const m = { B: T.BRICK, '?': T.QCOIN, P: T.QPOW, S: T.STONE, M: T.MULTI, H: T.HID_LIFE, h: T.HID_COIN, C: T.CRUMBLE, J: T.SPRING }; for (let i = 0; i < s.length; i++) { const v = m[s[i]]; if (v) set(x + i, y, v); if (v === T.HID_LIFE || v === T.HID_COIN) L.secretsTotal++; if (v === T.MULTI) L.multi[(x + i) + ',' + y] = 6; } return b; },
    stairs(x, n, dir = 1, top = 10) { for (let i = 0; i < n; i++) { const cx = dir > 0 ? x + i : x + n - 1 - i; for (let k = 0; k <= i; k++) set(cx, top - 1 - k, T.STONE); } return b; },
    block(x0, y0, x1, y1, v = T.STONE) { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) set(x, y, v); return b; },
    bunker(x, h = 2, top = 10) { for (let i = 0; i < 3; i++) for (let k = 0; k < h; k++) set(x + i, top - 1 - k, T.BUNKER); L.deco.push({ x: x * 16, y: (top - h) * 16, h }); return b; },
    coins(x, y, n) { for (let i = 0; i < n; i++) L.coins.push({ x: (x + i) * 16 + 3, y: y * 16 + 2, w: 10, h: 12, got: false }); return b; },
    arc(x, y, n) { for (let i = 0; i < n; i++) { const off = Math.round(Math.sin(i / (n - 1) * Math.PI) * 1.6); L.coins.push({ x: (x + i) * 16 + 3, y: (y - off) * 16 + 2, w: 10, h: 12, got: false }); } return b; },
    e(type, x, row = 9) { L.spawns.push({ type, x: x * 16, yb: (row + 1) * 16 }); return b; },
    lamb(x, row = 9) { L.lambs.push({ x: x * 16 + 1, y: (row + 1) * 16 - 8, w: 14, h: 8, got: false }); return b; },
    chest(x, row) { L.chests.push({ x: x * 16 + 1, y: row * 16 + 5, w: 14, h: 11, got: false }); L.secretsTotal++; return b; },
    piece(x, row) { L.pieces.push({ x: x * 16 + 2, y: row * 16 + 3, w: 12, h: 10, got: false }); return b; },
    key(x, row) { L.keys.push({ x: x * 16 + 1, y: row * 16 + 5, w: 14, h: 6, got: false }); return b; },
    cp(x) { L.cps.push({ x: x * 16, on: false }); return b; },
    vcoins(x, y, n) { for (let i = 0; i < n; i++) L.coins.push({ x: x * 16 + 3, y: (y + i) * 16 + 2, w: 10, h: 12, got: false }); return b; },
    feather(x, row) { L.feathers.push({ x: x * 16 + 3, y: row * 16 + 1, w: 10, h: 14, got: false }); return b; },
    plat(x, row, axis, range, speed, len = 3, phase = 0) { L.plats.push({ x0: x * 16, y0: row * 16, w: len * 16, h: 6, axis, range: range * 16, speed, phase, x: x * 16, y: row * 16, dx: 0, dy: 0, t: phase }); return b; },
    cannon(x, row, dir, period, phase = 0) { set(x, row, T.CANNON); L.cannons.push({ tx: x, ty: row, dir, period, phase, t: phase }); return b; },
    elephant(x) { L.elephants.push({ x: x * 16, y: 10 * 16 - 19, t: 0, hinted: false }); return b; },
    rocks(x0, x1, period) { L.rockZones.push({ x0: x0 * 16, x1: x1 * 16, period, t: 0 }); return b; },
    fish(x, period, delay = 0) { L.spawns.push({ type: 'fish', x: x * 16, yb: VH + 20, period, delay }); return b; },
    goal(x) { L.goal = { x: x * 16 }; set(x, 9, T.STONE); b.block(x - 5, 7, x - 4, 9); return b; },
    gate(x) { b.block(x, 0, x, 5, T.STONE); for (let y = 6; y <= 9; y++) set(x, y, T.GATE); L.gateX = x; return b; }
  };
  return b;
}

      await el.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch (e) { if (silent !== true) toast(say('fsNo'), 1800); return; }

}

/* ---------------- sizing ---------------- */
function resize() {

  VW = clamp(Math.round(VH * w / h), 256, 432);
  cv.width = VW; cv.height = VH; ctx.imageSmoothingEnabled = false;
  const portrait = h > w && isCoarse();

  if (portrait) pause();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ---------------- main loop ---------------- */
function tick() {

  if (input.startP) { if (st === 'play') pause(); else if (st === 'pause') resume(); }
  if (st === 'play') updateWorld();
  else if (st === 'clear') updClear();
  else if (st === 'freeing') updFreeing();
  else if (st === 'title' && L) { cam.x += 0.5; if (cam.x > L.w * 16 - VW) cam.x = 0; }
  if (st === 'play' || st === 'clear' || st === 'freeing') updHud();
}
let last = 0, accum = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = (ts - last) / 1000; last = ts; if (dt > 0.25) dt = 0.25;
  // Theth rush: Zana's milk runs the whole level (Orik, enemies, avalanche) 1.25× faster
  const rush = (L && L.rush && (st === 'play' || st === 'clear')) ? L.rush : 1;
  accum += dt * rush; let n = 0;
  while (accum >= 1 / 60 && n < 6) { tick(); accum -= 1 / 60; n++; }
  render();
}

window.claude?.hot?.snapshot?.(() => ({ unlocked: save.unlocked }));
function applyLang() {
  document.documentElement.lang = LANG;
  $('game').setAttribute('aria-label', say('canvas'));
  $('sPadB').textContent = say('padB'); $('sPadA').textContent = say('padA');
  $('bMute').setAttribute('aria-label', say('mute')); $('bPause').setAttribute('aria-label', say('pauseBtn'));
  $('sRotT').textContent = say('rotT'); $('sRotH').textContent = say('rotH'); $('bFsR').textContent = say('fs');
  for (const k in hudCache) delete hudCache[k];
}
function setLang(l, toMenu) { LANG = l === 'en' ? 'en' : 'sq'; save.lang = LANG; persist(); applyLang(); if (toMenu) toTitle(); }
function langPicker() {
  st = 'title'; stopMusic(); setHud(false); loadLevel(0);
  showScreen(`<div class="card">
    <div class="brand"><div class="flagbox"><canvas id="lEagle" width="22" height="20"></canvas></div><h1 class="logo">ORIK</h1></div>
    <p class="eyebrow">GJUHA · LANGUAGE</p><h2>Zgjidh gjuhën<br>Choose your language</h2>
    <div class="row"><button class="btn red" id="bSq" type="button">Shqip</button><button class="btn" id="bEn" type="button">English</button></div>
    <p class="hint">Mund ta ndryshosh më vonë nga menuja · You can change it later from the menu</p></div>`);
  paintEagle($('lEagle'));
  on('bSq', () => setLang('sq', true)); on('bEn', () => setLang('en', true));
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
function start() {
  resize();
  if (save.lang === 'en' || save.lang === 'sq') { LANG = save.lang; applyLang(); toTitle(); } else { applyLang(); langPicker(); }
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
